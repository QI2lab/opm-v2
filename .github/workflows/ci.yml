name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek / Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Run the same hooks as local commits
        run: uvx --from prek==0.5.7 prek run --all-files --show-diff-on-failure

  test:
    name: Windows / Python 3.12
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTEST_RUNNING: "1"
      JUPYTER_PLATFORM_DIRS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --extra test --locked --python 3.12

      - name: Install Micro-Manager test adapters
        run: uv run --locked mmcore install --test-adapters --plain-output

      # Isolate native MMCore/Qt state between the test categories.
      - name: Run unit tests
        run: uv run --locked python -m pytest tests/unit --color=yes --cov=opm_v2 --cov-report= -o faulthandler_timeout=120

      - name: Run integration tests
        run: uv run --locked python -m pytest tests/integration --color=yes --cov=opm_v2 --cov-append --cov-report= -o faulthandler_timeout=120

      - name: Run GUI tests
        run: uv run --locked python -m pytest tests/gui --color=yes --cov=opm_v2 --cov-append --cov-report=xml --cov-report=term-missing -o faulthandler_timeout=120

      - name: Upload coverage
        uses: codecov/codecov-action@v7

  release:
    name: GitHub release
    needs: [lint, test]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.29"

      - name: Build distributions
        run: uv build

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "./dist/*"
